[build-system]
requires = ["hatchling>=1.27"]  # 1.27: the SPDX licence fields below
build-backend = "hatchling.build"

[project]
name = "style-atlas"
version = "0.43.0"
description = "Measure, cluster, search and map illustration art styles (CSD style embeddings with hubness correction)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rinne414" }]
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.26",
  "pillow>=10.3",  # CVE-2024-28219 (buffer overflow) fixed in 10.3; images here are untrusted
  "torch>=2.4",
  "torchvision>=0.19",
  "open_clip_torch>=2.24",
  "huggingface_hub>=0.23",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "psutil>=5.9",
  "safetensors>=0.4",
]

[project.optional-dependencies]
umap = ["umap-learn>=0.5.6"]
app = ["pywebview>=5.3"]  # the desktop window (Edge WebView2 on Windows)
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
style-atlas = "styleatlas.cli:main"

[project.gui-scripts]
style-atlas-app = "styleatlas.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/styleatlas"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs the CSD weights (slow, downloads 2.4 GB on first run)"]
addopts = "-m 'not model'"
