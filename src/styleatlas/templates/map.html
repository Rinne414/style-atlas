<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style Atlas</title>
<meta name="description" content="Style Atlas: an interactive 3D map of image styles, with style groups, search and dataset checks.">
<script>
// the interface size before anything is drawn (map_shell.js changes it): the last one picked, else
// a little larger in a wide window (a 1440p screen at 100% scaling), where 15 px text reads small
(() => {
  let v = NaN;
  try { v = parseFloat(localStorage.getItem("styleAtlasUi")); } catch (e) { /* storage off */ }
  if (!(v >= 0.8 && v <= 1.6)) v = innerWidth >= 2200 ? 1.15 : 1;
  document.documentElement.style.setProperty("--ui", String(v));
})();
</script>
<style>
/*__MAP_CSS__*/
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="gl"></canvas>
    <div id="hud">
      <div id="title"><h1></h1><div class="sub"></div><div class="layout-note" hidden></div><button id="filterChip" hidden></button></div>
      <div class="tools">
        <button id="openOther" hidden></button>
        <input id="find" type="search">
        <div id="layoutSeg" class="seg" role="group"><button data-layout="groups"></button><button data-layout="style"></button></div>
        <span id="axes" hidden><select id="axX"></select><select id="axY"></select><select id="axZ"></select></span>
        <button id="names" class="on"></button>
        <button id="home"></button>
        <div class="menu-wrap">
          <button id="viewMenuBtn" aria-haspopup="true" aria-expanded="false"></button>
          <div id="viewMenu" class="menu" role="menu" hidden>
            <button id="layoutMeasures" role="menuitem"></button>
            <button id="mode" role="menuitem"></button>
            <button id="spin" role="menuitem"></button>
            <button id="savePng" role="menuitem"></button>
            <button id="rec" role="menuitem"></button>
            <hr>
            <div class="menu-row" id="uiSize"><span class="lbl"></span></div>
            <button id="theme" role="menuitem"></button>
            <button id="lang" role="menuitem"></button>
          </div>
        </div>
        <button id="helpBtn">?</button>
      </div>
    </div>
    <div id="live">
      <button id="pickBtn"></button>
      <input id="pickFile" type="file" accept="image/*" multiple hidden>
      <select id="gran"></select>
      <label id="thrLbl" class="lbl" for="thr"></label>
      <input id="thr" type="number" min="0.05" max="1.5" step="0.01">
      <input id="periods" type="number" min="2" max="8" step="1" hidden>
      <button id="regroup"></button>
      <button id="undo" hidden></button>
      <span class="sep"></span>
      <button id="exportOpen"></button>
      <button id="saveMap"></button>
      <button id="artistMap" hidden></button>
      <button id="moreOpen"></button>
      <span id="status"></span>
      <div id="morePanel" class="panel" hidden>
        <label id="neutralWrap" class="chip"><input id="neutral" type="checkbox"> <span></span></label>
        <input id="refPath" type="text">
        <button id="refLoad"></button>
        <button id="saveReport"></button>
      </div>
    </div>
    <div id="drop"></div>
    <div id="tip"><img alt=""><div class="cap"></div><div class="keys"></div></div>
    <div id="walkFrame" hidden></div>
    <div id="loading">…</div>
    <div id="help" hidden></div>
    <div id="exportPanel" role="dialog" aria-modal="true" aria-labelledby="exportTitle" hidden>
      <div class="dlg">
        <div class="dlg-head"><b id="exportTitle"></b><button id="exportClose" class="close">✕</button></div>
        <p id="exportWhere" class="sub"></p>
        <div class="exp-body">
          <section class="exp-groups">
            <div class="exp-groups-head"><span id="expPicked"></span><button id="expAll"></button><button id="expNone"></button></div>
            <div id="expList"></div>
          </section>
          <section class="exp-side">
            <div class="seg" id="expHow"><button data-how="separate"></button><button data-how="one"></button></div>
            <p id="expHowNote" class="sub"></p>
            <div class="form">
              <label for="expName" id="expNameLbl"></label><input id="expName" type="text">
              <label for="expDest" id="expDestLbl"></label>
              <div class="dest"><input id="expDest" type="text" spellcheck="false"><button id="expPick" hidden></button></div>
              <label for="expLayout" id="expLayoutLbl"></label>
              <select id="expLayout"><option value="plain"></option><option value="kohya"></option></select>
            </div>
            <label id="expTrigWrap" class="chip"><input id="expTrig" type="checkbox" checked> <span></span></label>
            <details id="expMore"><summary id="expMoreLbl"></summary>
              <div class="form">
                <label for="expRep" id="expRepLbl"></label><input id="expRep" type="number" min="1" max="100" step="1">
                <label for="expMax" id="expMaxLbl"></label><input id="expMax" type="number" min="1" step="1">
                <label for="expStrip" id="expStripLbl"></label><input id="expStrip" type="text">
              </div>
              <label id="expSpellWrap" class="chip"><input id="expSpell" type="checkbox"> <span></span></label>
            </details>
            <div id="expPlan"></div>
            <div class="actions"><button id="export" class="primary"></button></div>
          </section>
        </div>
      </div>
    </div>
    <section id="groupView" tabindex="-1" hidden></section>
  </main>
  <aside>
    <div class="tabs">
      <button data-pane="clusters" class="on"></button>
      <button data-pane="selected"></button>
      <button data-pane="artists" hidden></button>
      <button data-pane="taste" hidden></button>
      <button data-pane="lora"></button>
    </div>
    <div class="pane on" id="pane-clusters"></div>
    <div class="pane" id="pane-selected"></div>
    <div class="pane" id="pane-artists"></div>
    <div class="pane" id="pane-taste"></div>
    <div class="pane" id="pane-lora">
      <p class="lora-intro" hidden></p>
      <div id="steps" hidden><button data-step="check"></button><span>→</span><button data-step="groups"></button><span>→</span><button data-step="export"></button></div>
      <div id="loraAdvice"></div>
      <div class="subtabs"><button data-sub="outliers" class="on"></button><button data-sub="dups"></button></div>
      <div class="subpane on" id="pane-outliers"></div>
      <div class="subpane" id="pane-dups"></div>
    </div>
    <footer></footer>
  </aside>
</div>
<div id="viewer" role="dialog" aria-modal="true" hidden>
  <div class="stage"><button class="nav prev">‹</button><img alt=""><button class="nav next">›</button></div>
  <div class="bar"><div class="what"><b></b><span></span></div></div>
</div>
<script id="atlas-data" type="application/json">/*__STYLE_ATLAS_DATA__*/null</script>
<!-- three.js r160 (MIT, see LICENSE notice inside) is inlined so the map works offline -->
<script type="text/plain" id="src-three">/*__THREE_JS__*/</script>
<script type="text/plain" id="src-orbit">/*__ORBIT_JS__*/</script>

<script type="text/plain" id="src-main">
/*__MAP_JS__*/
</script>
<script>
(() => {
  const blob = (code) => URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
  const src = (id) => document.getElementById(id).textContent;
  const three = blob(src("src-three"));
  const orbit = blob(src("src-orbit").replace(/from\s*["']three["']/g, `from "${three}"`));
  const main = src("src-main")
    .replace(/from\s*["']three["']/g, `from "${three}"`)
    .replace(/from\s*["']three\/addons\/controls\/OrbitControls\.js["']/g, `from "${orbit}"`);
  const s = document.createElement("script");
  s.type = "module";
  s.src = blob(main);
  document.body.appendChild(s);
})();
</script>
</body>
</html>
