<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style Atlas</title>
<meta name="description" content="Style Atlas: an interactive 3D map of image styles, with style groups, search and dataset checks.">
<style>
/*__MAP_CSS__*/
</style>
</head>
<body>
<div id="app">
  <main id="stage">
    <canvas id="gl"></canvas>
    <div id="hud">
      <div id="title"><h1></h1><div class="sub"></div></div>
      <div class="tools">
        <input id="find" type="search">
        <select id="layoutSel"></select>
        <span id="axes" hidden><select id="axX"></select><select id="axY"></select><select id="axZ"></select></span>
        <button id="mode"></button>
        <button id="names" class="on"></button>
        <button id="rec"></button>
        <button id="savePng"></button>
        <button id="spin"></button>
        <button id="home"></button>
        <button id="theme">◐</button>
        <button id="lang">中</button>
        <button id="helpBtn">?</button>
      </div>
    </div>
    <div id="live">
      <button id="pickBtn"></button>
      <input id="pickFile" type="file" accept="image/*" multiple hidden>
      <select id="gran"></select>
      <label id="thrLbl" class="lbl" for="thr"></label>
      <input id="thr" type="number" min="0.05" max="1.5" step="0.01">
      <input id="periods" type="number" min="2" max="8" step="1" hidden>
      <button id="regroup"></button>
      <button id="undo" hidden></button>
      <span class="sep"></span>
      <button id="exportOpen"></button>
      <button id="saveMap"></button>
      <button id="artistMap" hidden></button>
      <button id="moreOpen"></button>
      <span id="status"></span>
      <div id="exportPanel" class="panel" hidden>
        <b id="exportTitle"></b>
        <select id="expLayout"><option value="plain"></option><option value="kohya">kohya</option></select>
        <label class="lbl" for="expName" id="expNameLbl"></label><input id="expName" type="text">
        <label class="lbl" for="expMax" id="expMaxLbl"></label><input id="expMax" type="number" min="1" step="1">
        <label class="lbl" for="expStrip" id="expStripLbl"></label><input id="expStrip" type="text">
        <label id="expTrigWrap" class="chip"><input id="expTrig" type="checkbox"> <span></span></label>
        <label id="expSpellWrap" class="chip"><input id="expSpell" type="checkbox"> <span></span></label>
        <button id="exportPreview"></button>
        <button id="export" class="primary"></button>
      </div>
      <div id="morePanel" class="panel" hidden>
        <label id="neutralWrap" class="chip"><input id="neutral" type="checkbox"> <span></span></label>
        <input id="refPath" type="text">
        <button id="refLoad"></button>
        <button id="saveReport"></button>
      </div>
    </div>
    <div id="drop"></div>
    <div id="tip"><img alt=""><div class="cap"></div></div>
    <div id="loading">…</div>
    <div id="help" hidden></div>
    <section id="groupView" tabindex="-1" hidden></section>
  </main>
  <aside>
    <div id="steps" hidden><button data-step="check"></button><span>→</span><button data-step="groups"></button><span>→</span><button data-step="export"></button></div>
    <div class="tabs">
      <button data-pane="clusters" class="on"></button>
      <button data-pane="selected"></button>
      <button data-pane="outliers"></button>
      <button data-pane="dups"></button>
      <button data-pane="taste" hidden></button>
    </div>
    <div class="pane on" id="pane-clusters"></div>
    <div class="pane" id="pane-selected"></div>
    <div class="pane" id="pane-outliers"></div>
    <div class="pane" id="pane-dups"></div>
    <div class="pane" id="pane-taste"></div>
    <footer></footer>
  </aside>
</div>
<script id="atlas-data" type="application/json">/*__STYLE_ATLAS_DATA__*/null</script>
<!-- three.js r160 (MIT, see LICENSE notice inside) is inlined so the map works offline -->
<script type="text/plain" id="src-three">/*__THREE_JS__*/</script>
<script type="text/plain" id="src-orbit">/*__ORBIT_JS__*/</script>

<script type="text/plain" id="src-main">
/*__MAP_JS__*/
</script>
<script>
(() => {
  const blob = (code) => URL.createObjectURL(new Blob([code], { type: "text/javascript" }));
  const src = (id) => document.getElementById(id).textContent;
  const three = blob(src("src-three"));
  const orbit = blob(src("src-orbit").replace(/from\s*["']three["']/g, `from "${three}"`));
  const main = src("src-main")
    .replace(/from\s*["']three["']/g, `from "${three}"`)
    .replace(/from\s*["']three\/addons\/controls\/OrbitControls\.js["']/g, `from "${orbit}"`);
  const s = document.createElement("script");
  s.type = "module";
  s.src = blob(main);
  document.body.appendChild(s);
})();
</script>
</body>
</html>
