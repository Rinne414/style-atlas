<!doctype html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<script>
// the interface size and colours the map uses (map.html, start.html): the last ones picked
(() => {
  let v = NaN, theme = null;
  try { v = parseFloat(localStorage.getItem("styleAtlasUi")); theme = localStorage.getItem("styleAtlasTheme"); } catch (e) { /* storage off */ }
  if (!(v >= 0.8 && v <= 1.6)) v = innerWidth >= 2200 ? 1.15 : 1;
  document.documentElement.style.setProperty("--ui", String(v));
  if (theme === "light") document.documentElement.dataset.theme = "light";
})();
</script>
<style>
  html { font-size: calc(16px * var(--ui, 1)); }
  :root { --bg: #0d0f12; --panel: #15181d; --ink: #e9e6e1; --muted: #8f949c; --accent: #f2c38b; --bad: #eb5757; }
  :root[data-theme="light"] { --bg: #f4f2ee; --panel: #ffffff; --ink: #1d1f23; --muted: #6b7078; --accent: #b4682a; --bad: #c0392b; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 1rem/1.6 system-ui, "Microsoft YaHei", "Noto Sans SC", "PingFang SC", sans-serif; }
  main { width: min(46rem, calc(100vw - 32px)); background: var(--panel); border-radius: 14px; padding: 1.6rem 1.9rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .3rem; }
  .note { color: var(--muted); font-size: .95rem; margin: 0 0 1rem; }
  .bar { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--muted) 25%, transparent); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 30%; background: var(--accent); border-radius: 3px;
    animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  @media (prefers-reduced-motion: reduce) { .bar i { animation: none; width: 100%; opacity: .5; } }
  ol { margin: 1rem 0 0; padding-left: 1.3rem; font-size: .95rem; color: var(--muted); max-height: 40vh; overflow: auto; }
  ol li:last-child { color: var(--ink); }
  #elapsed { font-variant-numeric: tabular-nums; }
  .error { color: var(--bad); white-space: pre-wrap; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>__HEADING__</h1>
  <p class="note">__NOTE__ <span id="elapsed"></span></p>
  <div class="bar" id="bar"><i></i></div>
  <ol id="lines" aria-live="polite"></ol>
  <div class="error" id="error" role="alert" hidden></div>
</main>
<script>
const TEXT = /*__TEXT__*/{};
const started = Date.now();
function tick() {
  const s = Math.round((Date.now() - started) / 1000);
  document.getElementById("elapsed").textContent = TEXT.elapsed.replace("{m}", Math.floor(s / 60)).replace("{s}", String(s % 60).padStart(2, "0"));
}
async function poll() {
  try {
    const r = await (await fetch("status", { cache: "no-store" })).json();
    if (r.ready) { location.reload(); return; }
    const ol = document.getElementById("lines");
    ol.replaceChildren(...(r.lines || []).map((line) => { const li = document.createElement("li"); li.textContent = line; return li; }));
    ol.scrollTop = ol.scrollHeight;
    if (r.error) {
      const box = document.getElementById("error"); box.hidden = false; box.textContent = TEXT.failed + "\n" + r.error;
      document.getElementById("bar").hidden = true;
      clearInterval(timer);
      return;
    }
  } catch (e) { /* the server may be busy for a moment; try again */ }
  setTimeout(poll, 1000);
}
const timer = setInterval(tick, 1000); tick(); poll();
</script>
</body>
</html>
